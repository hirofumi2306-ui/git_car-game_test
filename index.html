<title>頑張ろうニッポン！</title>
<style>
:root{--bg:#ECEEF1;--ink:#0E1116;--gr:#D3D8DF;--surf:#FFFFFF;--sub:#566070;--line:#D0D5DC;--acc:#E5232F;--grid:#DDE1E7;--dot:#C3C9D2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0D10;--ink:#F2F4F7;--gr:#1A1F26;--surf:#14181D;--sub:#98A1AD;--line:#262C34;--acc:#FF4753;--grid:#161A20;--dot:#2B323C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0D10;--ink:#F2F4F7;--gr:#1A1F26;--surf:#14181D;--sub:#98A1AD;--line:#262C34;--acc:#FF4753;--grid:#161A20;--dot:#2B323C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#jb{position:fixed;left:50%;top:30%;transform:translateX(-50%);width:min(320px,calc(100vw - 32px));display:none;flex-direction:column;gap:10px;z-index:5}
#jb input{font-size:16px;padding:12px;border-radius:10px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
#jb button{font-size:17px;font-weight:800;padding:14px;border:0;border-radius:8px;background:#E5232F;color:#fff}
#jb button:disabled{opacity:.5}
#jb #jsw{background:none;color:var(--sub);font-size:14px;padding:6px;text-decoration:underline}
#xb{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:7}
#xb .xc{width:min(340px,calc(100vw - 28px));background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
#xb textarea{font-size:13px;padding:10px;border-radius:10px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;word-break:break-all}
#xb button{font-size:16px;font-weight:800;padding:12px;border:0;border-radius:8px;background:#E5232F;color:#fff}
#xb #xclose{background:#78909c}
#xtl{font-weight:800;font-size:16px}#xmsg{font-size:12px;line-height:1.5}
#jmsg{min-height:1.4em;font-size:13px;color:#e65100;text-align:center;font-weight:700}
</style>
</head>

<canvas id="c"></canvas>
<div id="xb"><div class="xc"><div id="xtl"></div><textarea id="xt" rows="6" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea><button id="xcopy">コピーする</button><button id="xgo">この内容で復元する</button><button id="xclose">閉じる</button><div id="xmsg"></div></div></div>
